spring.application.name=road-maintenance-system
server.port=8080

# MySQL DataSource configuration (environment variables DB_URL, DB_USERNAME, DB_PASSWORD with localhost defaults)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/road_maintenance_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA and Hibernate configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Sample data initialization disabled to maintain empty database
app.init-sample-data=false

# Admin setup secret key
app.admin.secret-key=${ADMIN_SECRET_KEY:ADMIN_SECRET_KEY_2026}

# Spring Mail Configuration (Gmail SMTP)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${MAIL_FROM:${spring.mail.username:noreply@smartroadops.gov}}

# JWT Configuration
app.jwt.secret=${JWT_SECRET:MunicipalRoadMaintenanceSecretKey2026SecureHMACKey9876543210}

# Show error messages in responses
server.error.include-message=always
server.error.include-binding-errors=always
